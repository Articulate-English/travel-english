<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel English for Italians - Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#03030a;--accent:#22d3ee;--violet:#8b5cf6;--text:#f4f1ea;--muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding:2rem}
h1{font-family:'Roboto Flex',sans-serif;font-size:clamp(2.5rem,6vw,4rem);text-align:center;margin-bottom:.5rem}
.sub{text-align:center;color:var(--muted);margin-bottom:2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.2rem;max-width:1300px;margin:0 auto}
.card{background:#0f172a;border:1px solid rgba(255,255,255,.12);border-radius:16px;overflow:hidden;text-decoration:none;color:var(--text);transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px);box-shadow:0 0 0 1px var(--accent),0 20px 40px rgba(34,211,238,.25)}
.card img{width:100%;height:150px;object-fit:cover;display:block}
.card-body{padding:.9rem 1.1rem}
.card-title{font-family:'Roboto Flex',sans-serif;font-size:1.25rem;margin-bottom:.3rem}
.card-desc{font-size:.85rem;color:var(--muted)}
.progress{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--violet));z-index:10;transition:width .3s}
.vp{display:inline-block}
.hero-btn{margin:1.5rem auto 2rem;display:block;padding:1rem 2.5rem;border:none;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--violet));color:#000;font-weight:700;font-size:1.05rem;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 10px 30px rgba(34,211,238,.35)}
.hero-btn:hover{transform:scale(1.08) translateY(-3px);box-shadow:0 16px 40px rgba(139,92,246,.45)}
.hero-btn:active{transform:scale(.96)}
.badge{position:fixed;top:12px;right:16px;z-index:10;background:#0f172a;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:.4rem .9rem;font-size:.85rem}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div class="badge">🔥 <span id="streak">0</span> · <span id="done">0</span>/12</div>
<canvas id="dotfield" style="position:fixed;inset:0;z-index:-1;pointer-events:none"></canvas>
<h1 id="heroTitle">Travel English</h1>
<p class="sub">12 interactive lessons for Italian speakers. Pick any topic.</p>
<button class="hero-btn" onclick="document.getElementById('grid').scrollIntoView({behavior:'smooth'})">Start Learning</button>
<div class="grid" id="grid"></div>
<script>
const data=[
 {name:"Airport",img:"https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=600&q=80",url:"lesson-1-airport.html",desc:"Check-in, boarding, luggage"},
 {name:"Hotel",img:"https://images.unsplash.com/photo-1566073771259-6a8506099945?w=600&q=80",url:"lesson-2-hotel.html",desc:"Reservations, amenities"},
 {name:"Transport",img:"https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=600&q=80",url:"lesson-3-transport.html",desc:"Taxi, subway, tickets"},
 {name:"Restaurant",img:"https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=600&q=80",url:"lesson-4-restaurant.html",desc:"Ordering, menus, tipping"},
 {name:"Shopping",img:"https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=600&q=80",url:"lesson-5-shopping.html",desc:"Money, receipts, sizes"},
 {name:"Directions",img:"https://images.unsplash.com/photo-1577717903315-1691ae25ab3f?w=600&q=80",url:"lesson-6-directions.html",desc:"Landmarks, turns"},
 {name:"Emergency",img:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600&q=80",url:"lesson-7-emergency.html",desc:"Help, police, embassy"},
 {name:"Beach",img:"https://images.unsplash.com/photo-1473116763249-2faaef81ccda?w=600&q=80",url:"lesson-8-beach.html",desc:"Sun, sea, leisure"},
 {name:"Cultural Sites",img:"https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=600&q=80",url:"lesson-9-sites.html",desc:"Museums, tours"},
 {name:"Weather",img:"https://images.unsplash.com/photo-1499793983690-e29da59ef1c2?w=600&q=80",url:"lesson-10-weather.html",desc:"Forecast, seasons"},
 {name:"Planning",img:"https://images.unsplash.com/photo-1543269865-cbf427effbad?w=600&q=80",url:"lesson-11-planning.html",desc:"Itinerary, visas"},
 {name:"Expressions",img:"https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=600&q=80",url:"lesson-12-expressions.html",desc:"Polite phrases"}
];
const done=JSON.parse(localStorage.getItem('te-done')||'[]');
function refresh(){document.getElementById('done').textContent=done.length;document.getElementById('progress').style.width=(done.length/12*100)+'%';document.getElementById('streak').textContent=localStorage.getItem('te-streak')||0}
refresh();
const grid=document.getElementById('grid');
data.forEach(c=>{
  const a=document.createElement('a');a.className='card';a.href=c.url;
  if(done.includes(c.url))a.style.outline='2px solid var(--accent)';
  a.addEventListener('click',()=>{if(!done.includes(c.url)){done.push(c.url);localStorage.setItem('te-done',JSON.stringify(done));const today=new Date().toDateString();if(localStorage.getItem('te-last')!==today){localStorage.setItem('te-streak',String((parseInt(localStorage.getItem('te-streak')||0)+1)));localStorage.setItem('te-last',today)}refresh()}});
  a.innerHTML='<img src="'+c.img+'" alt="'+c.name+'" loading="lazy"><div class="card-body"><div class="card-title">'+c.name+'</div><div class="card-desc">'+c.desc+'</div></div>';
  grid.appendChild(a);
});
// DotField background
(function(){const c=document.getElementById('dotfield');const ctx=c.getContext('2d');let w,h,dots=[];function resize(){w=c.width=innerWidth;h=c.height=innerHeight;dots=[];const gap=36;for(let x=gap/2;x<w;x+=gap)for(let y=gap/2;y<h;y+=gap)dots.push({x,y})}resize();addEventListener('resize',resize);let mx=-9999,my=-9999;addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});function frame(){ctx.fillStyle='rgba(3,3,10,0.2)';ctx.fillRect(0,0,w,h);for(const d of dots){const dist=Math.hypot(d.x-mx,d.y-my);const swell=1+(1-Math.min(dist,400)/400)*8;const r=1.4*swell;const a=0.12+0.4*(1-Math.min(dist,400)/400);ctx.beginPath();ctx.arc(d.x,d.y,r,0,Math.PI*2);ctx.fillStyle='rgba(34,211,238,'+a+')';ctx.fill()}requestAnimationFrame(frame)}frame()})();
// Variable proximity title
(function(){const el=document.getElementById('heroTitle');const text=el.textContent;el.textContent='';const chars=[];for(const ch of text){const s=document.createElement('span');s.className='vp';s.textContent=ch;s.style.fontVariationSettings="'wght' 400,'opsz' 144";el.appendChild(s);chars.push(s)}let mx=-9999,my=-9999;addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});function frame(){for(const s of chars){const r=s.getBoundingClientRect();const cx=r.left+r.width/2;const cy=r.top+r.height/2;const dist=Math.hypot(cx-mx,cy-my);const t=Math.max(0,1-dist/200);const sm=t*t*t*(t*(t*6-15)+10);s.style.fontVariationSettings="'wght' "+(400+600*sm)+",'opsz' "+(144-100*sm)}requestAnimationFrame(frame)}frame()})();
</script>
</body>
</html>
